<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Quiz Interativo para estudo do Curso de Formação de Sargentos Bombeiros Militares (CFSBM 2026) — Fase EAD, Módulo II." />
  <meta name="theme-color" content="#1e4fba" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0a0f1e" media="(prefers-color-scheme: dark)" />
  <title>Quiz Interativo — CFSBM 2026</title>

  <script>
    (() => {
      try {
        const saved = localStorage.getItem('quiz_interativo_theme');
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (saved === 'dark' || (!saved && prefersDark)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    })();
  </script>

  <!-- Preconnect Google Fonts (performance) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap">

  <!-- Favicon SVG embutido -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231e4fba' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><rect x='8' y='2' width='8' height='4' rx='1'/><path d='M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2'/></svg>" />

  <!-- CSS -->
  <link rel="stylesheet" href="./css/styles.css" />
</head>

<body>

  <a class="skip-link" href="#main">Pular para o conteúdo</a>

  <main class="container" id="main">

    <!-- ============================================================
           CABEÇALHO
           ============================================================ -->
    <header class="cabecalho">
      <div class="cabecalho-info">
        <h1 id="titulo">Quiz Interativo</h1>
        <p class="subtitulo" id="subtitulo">Carregando matérias…</p>
      </div>

      <div class="cabecalho-acoes">
        <!-- Streak Badge -->
        <div class="streak-badge" id="streakBadge" data-streak="0" title="Sequência de acertos consecutivos"
          aria-live="polite">
          <span class="streak-icone" aria-hidden="true"></span><span id="streakCount">0</span>
        </div>

        <!-- Dashboard -->
        <button class="btn-cinza btn-dashboard" id="btnDashboard" type="button" aria-label="Abrir Dashboard de desempenho"
          title="Dashboard de desempenho" onclick="window.location.href='./pages/dashboard.html'">
          <span class="btn-icone" aria-hidden="true"></span> Gráficos
        </button>

        <button class="btn-cinza" id="btnLogout" type="button" aria-label="Sair da conta" title="Sair da conta">
          <span class="btn-icone" aria-hidden="true"></span> Sair
        </button>

        <!-- Botão de tema -->
        <button class="btn-tema" id="btnTema" type="button" aria-label="Alternar tema claro/escuro"
          title="Alternar tema">
          <span aria-hidden="true">☾</span>
        </button>
      </div>
    </header>

    <!-- ============================================================
           MENSAGEM DE ERRO GLOBAL
           ============================================================ -->
    <div class="erro" id="avisoErro" role="alert" hidden>
      <div>
        <strong>Não foi possível carregar o quiz.</strong>
        <p id="mensagemErro"></p>
      </div>
    </div>

    <!-- ============================================================
           TELA DE CARREGAMENTO
           ============================================================ -->
    <section id="telaCarregando" class="tela" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
      <p>Carregando matérias e questões…</p>
    </section>

    <!-- ============================================================
           TELA PRINCIPAL DO QUIZ
           ============================================================ -->
    <section id="telaQuiz" class="tela" hidden>

      <!-- Controles e Filtros de Topo -->
      <div class="controles-topo" id="controlesTopo">
        <!-- Toolbar: Matéria, Questão, Status e Ações -->
        <div class="toolbar">
          <label for="subjectSelect" class="toolbar-campo toolbar-materia">
            Matéria
            <select id="subjectSelect"></select>
          </label>

          <label for="questionSelect" class="toolbar-campo toolbar-questao">
            Questão
            <select id="questionSelect"></select>
          </label>

          <div class="toolbar-status-badge">
            <span class="status-badge-item" id="contadorQuestao">Questão 1 de 1</span>
            <span class="status-badge-divider" aria-hidden="true">•</span>
            <span class="status-badge-item status-pontuacao" id="pontuacao">Acertos: 0 | Erros: 0</span>
          </div>

          <div class="toolbar-acoes">
            <button id="encerrarRevisaoBtn" class="btn-cinza" type="button" title="Sair do modo de revisão" hidden>
              <span class="btn-icone" aria-hidden="true"></span> Sair da Revisão
            </button>
            <button id="btnModoFoco" class="btn-primario" type="button" title="Ativar Modo Foco">
              <span class="btn-icone" aria-hidden="true"></span> Modo Foco
            </button>
            <button id="reiniciarBtn" class="btn-vermelho" type="button" title="Reiniciar progresso desta matéria">
              <span class="btn-icone" aria-hidden="true"></span> Reiniciar Matéria
            </button>
          </div>
        </div>

        <!-- Painel de Filtros Dinâmicos -->
        <div class="painel-filtros" id="painelFiltros">
          <div class="filtros-header">
            <span class="filtros-titulo"><span class="btn-icone" aria-hidden="true"></span> Filtros Dinâmicos</span>
            <div class="filtros-info">
              <span class="filtros-badge" id="filtroContador">Total: 0 questões</span>
              <button id="btnLimparFiltros" class="btn-limpar-filtros" type="button" title="Limpar todos os filtros"
                hidden>
                <span class="btn-icone" aria-hidden="true"></span> Limpar filtros
              </button>
            </div>
          </div>

          <div class="filtros-grid">
            <div class="filtro-item filtro-busca-item">
              <label for="filtroBusca">Buscar por Título / Palavra-chave</label>
              <div class="input-com-icone">
                <span class="icone-busca" id="iconeBusca" aria-hidden="true"></span>
                <input type="text" id="filtroBusca" placeholder="Filtrar por título, texto ou capítulo..."
                  autocomplete="off" />
              </div>
            </div>

            <div class="filtro-item filtro-tema-item">
              <label for="filtroTema">Tema / Categoria</label>
              <select id="filtroTema">
                <option value="">Todos os Temas</option>
              </select>
            </div>

            <div class="filtro-item filtro-dificuldade-item">
              <label for="filtroDificuldade">Nível de Dificuldade</label>
              <select id="filtroDificuldade">
                <option value="">Todas as Dificuldades</option>
                <option value="facil">Fácil</option>
                <option value="medio">Média</option>
                <option value="dificil">Difícil</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Barra de Progresso Integrada -->
        <div class="progresso-wrapper">
          <div class="barra-progresso" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"
            aria-label="Progresso do quiz">
            <div class="barra-preenchimento" id="progressBar"></div>
          </div>
          <p class="info-questao" id="progressText">0% concluído • 0/0 respondidas</p>
        </div>
      </div>

      <!-- Card da questão (Split View no Desktop) -->
      <div class="question-card" id="questionCard">
        <div class="foco-zoom-container" id="focoZoomContainer">
          <div class="question-col-esquerda">
            <!-- Meta: Tema e Dificuldade -->
            <div class="question-meta">
              <span id="questionTopic">Tema</span>
              <span id="questionDifficulty">Dificuldade</span>
            </div>

            <!-- Texto da Pergunta -->
            <h2 class="pergunta" id="questionText">Carregando…</h2>

            <!-- Feedback -->
            <div class="feedback" id="feedbackBox" role="status" tabindex="-1" hidden></div>
          </div>

          <div class="question-col-direita">
            <!-- Alternativas -->
            <div class="alternativas" id="alternativas" role="group" aria-label="Alternativas"></div>

            <!-- Navegação -->
            <div class="navegacao" id="navegacaoContainer">
              <button class="btn-vermelho" id="btnSairFoco" type="button" title="Sair do Modo Foco" hidden>Sair do Foco</button>
              <button class="btn-verde" id="btnVoltar" type="button" title="Questão anterior (←)">← Anterior</button>
              <button class="btn-primario" id="btnConfirmar" type="button">Confirmar Resposta</button>
              <button class="btn-verde" id="btnProxima" type="button" title="Próxima questão (→)">Próxima →</button>
            </div>
          </div>
        </div>
      </div>
    </section>



  </main><!-- /#main -->

  <!-- ============================================================
         TOAST NOTIFICATIONS
         ============================================================ -->
  <div class="toast-container" id="toastContainer" aria-live="polite" aria-atomic="true"></div>

  <!-- ============================================================
         MODAL DE CONFIRMAÇÃO
         ============================================================ -->
  <div class="modal-overlay hidden" id="modalOverlay" role="dialog" aria-modal="true" aria-labelledby="modalTitulo">
    <div class="modal-card">
      <span class="modal-icone" id="modalIcone" aria-hidden="true"></span>
      <h3 class="modal-titulo" id="modalTitulo">Confirmar ação</h3>
      <p class="modal-texto" id="modalTexto">Tem certeza?</p>
      <div class="modal-acoes">
        <button class="btn-cinza" id="modalCancelar" type="button">Cancelar</button>
        <button class="btn-vermelho" id="modalConfirmar" type="button">Confirmar</button>
      </div>
    </div>
  </div>

  <!-- ============================================================
         NOSCRIPT FALLBACK
         ============================================================ -->
  <noscript>
    <div style="position:fixed;inset:0;display:grid;place-items:center;padding:24px;background:#f1f5f9;color:#1e293b;font-family:'Inter',system-ui,sans-serif;text-align:center;z-index:10000;">
      <div style="max-width:420px;">
        <h2 style="font-family:'Outfit',sans-serif;font-size:22px;margin-bottom:12px;color:#1e3a8a;">JavaScript é necessário</h2>
        <p style="font-size:14px;line-height:1.6;color:#475569;margin:0;">
          O Quiz Interativo CFSBM 2026 precisa de JavaScript habilitado para carregar as matérias e registrar suas respostas.
        </p>
      </div>
    </div>
  </noscript>

  <script src="./api-config.js"></script>
  <script src="./js/icons.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/app.js"></script>
</body>

</html>
