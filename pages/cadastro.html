<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Cadastro do Quiz Interativo CFSBM 2026" />
  <title>Cadastro | Quiz Interativo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="../css/auth.css" />
</head>

<body class="auth-page">

  <main class="auth-shell">
    <section class="auth-card" aria-labelledby="cadastroTitle">
      <div class="auth-header">
        <div class="auth-badge" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="32" height="32"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/></svg></div>
        <div>
          <p class="auth-overline">Quiz Interativo</p>
          <h1 id="cadastroTitle">Criar conta</h1>
        </div>
      </div>

      <form id="cadastroForm" class="auth-form" novalidate>
        <label class="field" for="cadastroNome">
          <span>Nome completo</span>
          <input id="cadastroNome" name="nome" type="text" placeholder="Digite seu nome completo" required />
        </label>

        <label class="field" for="cadastroEmail">
          <span>E-mail</span>
          <input id="cadastroEmail" name="email" type="email" autocomplete="email" placeholder="Digite seu e-mail" required />
        </label>

        <label class="field" for="cadastroUsuario">
          <span>Usuário</span>
          <input id="cadastroUsuario" name="usuario" type="text" autocomplete="username" placeholder="Escolha um nome de usuário" required />
        </label>

        <label class="field" for="cadastroSenha">
          <span>Senha</span>
          <div class="password-field">
            <input id="cadastroSenha" name="senha" type="password" autocomplete="new-password" placeholder="Crie uma senha segura" required />
            <button type="button" class="password-toggle" aria-label="Mostrar senha" data-target="cadastroSenha">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </label>

        <button type="submit" class="auth-submit">Cadastrar</button>
        <p class="auth-message" role="status" aria-live="polite"></p>
      </form>

      <p class="auth-footer">
        Já possui conta?
        <a href="./login.html">Faça login</a>
      </p>
    </section>
  </main>

  <script src="../api-config.js"></script>
  <script src="../js/auth.js"></script>
</body>

</html>
