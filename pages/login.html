<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Login do Quiz Interativo CFSBM 2026" />
  <title>Login | Quiz Interativo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="../css/auth.css" />
</head>

<body class="auth-page">

  <main class="auth-shell">
    <section class="auth-card" aria-labelledby="loginTitle">
      <div class="auth-header">
        <div class="auth-badge" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="32" height="32"><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg></div>
        <div>
          <p class="auth-overline">Quiz Interativo</p>
          <h1 id="loginTitle">Acessar conta</h1>
        </div>
      </div>

      <form id="loginForm" class="auth-form" novalidate>
        <label class="field" for="loginUsuario">
          <span>Usuário</span>
          <input id="loginUsuario" name="usuario" type="text" autocomplete="username" placeholder="Digite seu usuário" required />
        </label>

        <label class="field" for="loginSenha">
          <span>Senha</span>
          <div class="password-field">
            <input id="loginSenha" name="senha" type="password" autocomplete="current-password" placeholder="Digite sua senha" required />
            <button type="button" class="password-toggle" aria-label="Mostrar senha" data-target="loginSenha">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </label>

        <button type="submit" class="auth-submit">Entrar</button>
        <p class="auth-message" role="status" aria-live="polite"></p>
      </form>

      <p class="auth-footer">
        Ainda não tem conta?
        <a href="./cadastro.html">Crie agora</a>
      </p>
    </section>
  </main>

  <script src="../api-config.js"></script>
  <script src="../js/auth.js"></script>
</body>

</html>
