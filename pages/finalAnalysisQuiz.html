<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Quiz Interativo para estudo do Curso de Formação de Sargentos Bombeiros Militares (CFSBM 2026) — Resultado Final." />
  <meta name="theme-color" content="#1e4fba" />
  <title>Resultado Final — CFSBM 2026</title>

  <!-- Favicon SVG embutido -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231e4fba' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9H4.5a2.5 2.5 0 0 1 0-5H6'/><path d='M18 9h1.5a2.5 2.5 0 0 0 0-5H18'/><path d='M4 22h16'/><path d='M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22'/><path d='M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22'/><path d='M18 2H6v7a6 6 0 0 0 12 0V2Z'/></svg>" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap">

  <!-- CSS -->
  <link rel="stylesheet" href="../css/styles.css" />
</head>

<body>

  <main class="container" id="main">
    <header class="cabecalho">
      <div class="cabecalho-info">
        <h1 id="titulo">Análise Final</h1>
        <p class="subtitulo" id="subtitulo">Confira seu desempenho na matéria concluída.</p>
      </div>
      <div style="display:flex; align-items:center; gap:10px; position:relative; z-index:1">
        <button class="btn-tema" id="btnTema" type="button" aria-label="Alternar tema claro/escuro"
          title="Alternar tema">
        </button>
      </div>
    </header>

    <section id="telaResultado" class="tela">
      <div class="resultado-card">
        <span class="resultado-icone" id="resultadoIcone" aria-hidden="true"></span>
        <h2 class="resultado-titulo" id="resultadoTitulo">Matéria Concluída!</h2>
        <p class="resultado-subtitulo" id="resultadoSubtitulo">Carregando seus resultados...</p>

        <div class="resultado-stats">
          <div class="stat-box total">
            <div class="stat-numero" id="statTotal">0</div>
            <div class="stat-label">Total</div>
          </div>
          <div class="stat-box respondidas">
            <div class="stat-numero" id="statRespondidas">0</div>
            <div class="stat-label">Respondidas</div>
          </div>
          <div class="stat-box acertos">
            <div class="stat-numero" id="statAcertos">0</div>
            <div class="stat-label">Acertos</div>
          </div>
          <div class="stat-box erros">
            <div class="stat-numero" id="statErros">0</div>
            <div class="stat-label">Erros</div>
          </div>
          <div class="stat-box porcentagem">
            <div class="stat-numero" id="statPorcentagem">0%</div>
            <div class="stat-label">Aproveitamento</div>
          </div>
        </div>

        <!-- Módulo de Revisão -->
        <div class="revisao-modulo">
          <div class="revisao-filtros">
            <button class="btn-filtro active" id="btnFiltroTodas">Todas as Questões</button>
            <button class="btn-filtro btn-filtro-erros" id="btnFiltroErros">Revisar Apenas Erradas</button>
          </div>


        </div>

        <div class="resultado-acoes" style="flex-wrap: wrap;">
          <button class="btn-vermelho" id="btnReiniciarResultado" type="button" style="margin-left: 0;">
            <span class="btn-icone" aria-hidden="true"></span> Reiniciar Matéria
          </button>
          <button class="btn-primario" id="btnVoltarMenu" type="button" style="margin-left: auto;">Voltar ao
            Menu</button>
        </div>
      </div>
    </section>
  </main>

  <script src="../js/icons.js"></script>
  <script src="../js/finalAnalysis.js"></script>
</body>

</html>
